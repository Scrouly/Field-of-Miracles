<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Пульт ведущего — Вход</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0b132b;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .pin-card {
      background: #1c2541;
      border: 2px solid rgba(244, 196, 48, 0.4);
      border-radius: 20px;
      padding: 36px 30px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }
    h1 {
      font-size: 24px;
      color: #f4c430;
      margin-bottom: 8px;
    }
    p {
      color: #a0aec0;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .error-msg {
      color: #e63946;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 16px;
    }
    .pin-display {
      width: 100%;
      height: 56px;
      background: #0b132b;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      font-size: 28px;
      letter-spacing: 12px;
      color: #ffffff;
      text-align: center;
      margin-bottom: 24px;
      outline: none;
    }
    .pin-display:focus {
      border-color: #f4c430;
      box-shadow: 0 0 12px rgba(244, 196, 48, 0.3);
    }
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .btn-key {
      height: 64px;
      background: #243356;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
      transition: background 0.1s;
    }
    .btn-key:active { background: #f4c430; color: #0b132b; }
    .btn-submit {
      width: 100%;
      height: 56px;
      background: #f4c430;
      color: #0b132b;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn-submit:active { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="pin-card">
    <h1>ОАО «Доломит»</h1>
    <p>Введите PIN-код для входа в пульт ведущего</p>

    {% if error %}
      <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/host/">
      {% csrf_token %}
      <input type="password" id="pin-input" name="pin" class="pin-display" maxlength="8" autofocus autocomplete="off" required>

      <div class="keypad">
        <button type="button" class="btn-key" onclick="appendPin('1')">1</button>
        <button type="button" class="btn-key" onclick="appendPin('2')">2</button>
        <button type="button" class="btn-key" onclick="appendPin('3')">3</button>
        <button type="button" class="btn-key" onclick="appendPin('4')">4</button>
        <button type="button" class="btn-key" onclick="appendPin('5')">5</button>
        <button type="button" class="btn-key" onclick="appendPin('6')">6</button>
        <button type="button" class="btn-key" onclick="appendPin('7')">7</button>
        <button type="button" class="btn-key" onclick="appendPin('8')">8</button>
        <button type="button" class="btn-key" onclick="appendPin('9')">9</button>
        <button type="button" class="btn-key" onclick="clearPin()">C</button>
        <button type="button" class="btn-key" onclick="appendPin('0')">0</button>
        <button type="button" class="btn-key" onclick="backspacePin()">⌫</button>
      </div>

      <button type="submit" class="btn-submit">Войти в пульт</button>
    </form>
  </div>

  <script>
    const pinInput = document.getElementById('pin-input');
    function appendPin(num) {
      if (pinInput.value.length < 8) pinInput.value += num;
    }
    function clearPin() { pinInput.value = ''; }
    function backspacePin() { pinInput.value = pinInput.value.slice(0, -1); }
  </script>
</body>
</html>
